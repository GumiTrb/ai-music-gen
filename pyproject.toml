[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "musicgen"
version = "0.1.0"
description = "Управляемая генерация фортепианной MIDI-музыки: n-gram, LSTM, GRU, Transformer"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "miditoolkit>=1.0.1", "PyYAML>=6.0", "pandas>=2.0", "matplotlib>=3.7", "tqdm>=4.65"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
